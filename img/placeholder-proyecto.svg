<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <defs>
        <!-- Mismo paso que el puntillé del body (7px) para que no se note el empalme. -->
        <pattern id="puntille" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="3.5" cy="3.5" r="0.9" fill="#000000" opacity="0.3" />
        </pattern>
    </defs>

    <rect width="800" height="500" fill="#ffffff" />
    <rect width="800" height="500" fill="url(#puntille)" />

    <!-- Silueta: una ventana con barra de título y sus tres puntos. -->
    <rect x="200" y="150" width="400" height="220" fill="#000000" />
    <rect x="222" y="172" width="356" height="176" fill="#ffffff" />
    <g fill="#ffffff">
        <circle cx="240" cy="161" r="4" />
        <circle cx="254" cy="161" r="4" />
        <circle cx="268" cy="161" r="4" />
    </g>

    <rect x="6" y="6" width="788" height="488" fill="none" stroke="#000000" stroke-width="2" />
</svg>