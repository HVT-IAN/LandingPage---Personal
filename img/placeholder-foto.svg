<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
        <!-- Mismo paso que el puntillé del body (7px) para que no se note el empalme. -->
        <pattern id="puntille" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="3.5" cy="3.5" r="0.9" fill="#000000" opacity="0.3" />
        </pattern>
    </defs>

    <rect width="400" height="400" fill="#ffffff" />
    <rect width="400" height="400" fill="url(#puntille)" />

    <!-- Silueta: cabeza + hombros en media luna. -->
    <g fill="#000000">
        <circle cx="200" cy="158" r="52" />
        <path d="M 65 360 a 135 135 0 0 1 270 0 Z" />
    </g>

    <rect x="6" y="6" width="388" height="388" fill="none" stroke="#000000" stroke-width="2" />
</svg>
